<!-- @dsCard group="Marque" viewport="700x200" subtitle="Canvas « réseau neuronal » en fond fixe" name="Fond animé" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:#0a0e1a;color:#fff;font-family:var(--font-text);font-size:13px}
.w{padding:20px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:12px;flex-wrap:wrap}
.sw{flex:1 1 140px;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:6px;border:1px solid #ffffff1f}
.v{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#fff}.r{color:#9ca3af;font-size:12px;line-height:1.35}.src{font-size:11px;color:#10d7fd;font-family:ui-monospace,Menlo,monospace}
.t{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 14px;align-items:center;font-size:12px}.t .h{color:#7e8da3;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}.ok{color:#5fd38d}.ko{color:#ff7a7a}.muted{color:#7e8da3}
</style></head><body><div class="w"><canvas id="c" width="660" height="120" style="background:#0a0e1a;border-radius:6px;width:100%;height:120px"></canvas><div class="r">Canvas fixe plein écran, fond #0a0e1a. Nœuds : rayon 0.5–2 px, rgba(0,200,255,.55), vitesse ±0.125 px/frame, densité 1 nœud / 14 000 px². Liaisons &lt; 130 px : trait 0.5 px, alpha (1 − d/130) × 0.4.</div>
<script>const c=document.getElementById('c'),x=c.getContext('2d'),W=c.width,H=c.height,n=[];for(let i=0;i<Math.floor(W*H/1400);i++)n.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.5+.5});(function d(){x.clearRect(0,0,W,H);n.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1});for(let i=0;i<n.length;i++){for(let j=i+1;j<n.length;j++){const dx=n[i].x-n[j].x,dy=n[i].y-n[j].y,k=Math.hypot(dx,dy);if(k<130){x.beginPath();x.strokeStyle='rgba(0,200,255,'+(1-k/130)*.4+')';x.lineWidth=.5;x.moveTo(n[i].x,n[i].y);x.lineTo(n[j].x,n[j].y);x.stroke()}}x.beginPath();x.arc(n[i].x,n[i].y,n[i].r,0,7);x.fillStyle='rgba(0,200,255,.55)';x.fill()}requestAnimationFrame(d)})()</script></div></body></html>
