<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" width="280" height="100">
  <title>MZI Consulting — logo (version fond sombre)</title>
  <!-- Symbole : cercles reliés, reconstruit d'après le fichier source
       Logo-MZI-Agency.jpg (1080x1080) -->
  <g fill="#FFFFFF">
    <circle cx="35" cy="30" r="26" />
    <circle cx="56" cy="56" r="18" />
    <circle cx="17" cy="73" r="11" />
  </g>
  <!-- Texte "MZI" : blanc, gras, géométrique -->
  <text x="84" y="46" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="42" fill="#FFFFFF" letter-spacing="1">MZI</text>
  <!-- Bandeau cyan + "CONSULTING" en bleu nuit -->
  <rect x="84" y="56" width="140" height="27" rx="13.5" fill="#10D7FD" />
  <text x="154" y="74" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="15" fill="#0C0F14" letter-spacing="1.5" text-anchor="middle">CONSULTING</text>
</svg>
