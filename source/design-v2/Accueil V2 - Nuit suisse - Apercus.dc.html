<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&amp;family=Instrument+Serif&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#1a2033;font-family:Geist,system-ui,sans-serif}a{color:#10d7fd}a:hover{color:#7fe9fe}</style>
</helmet>
<section style="padding:64px;display:flex;flex-direction:column;gap:32px">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="font:500 13px Geist;letter-spacing:.14em;text-transform:uppercase;color:#10d7fd">Accueil V2 « Nuit suisse »</div>
    <div style="font:400 44px 'Instrument Serif',serif;color:#fff">Desktop 1440 px et mobile 390 px</div>
    <a href="Accueil V2 - Nuit suisse.dc.html" style="font:500 16px Geist">Ouvrir la page seule</a>
  </div>
  <div style="display:flex;gap:64px;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font:500 16px Geist;color:#fff">Desktop · 1440 px</div>
      <iframe ref="{{ d }}" src="Accueil V2 - Nuit suisse.dc.html" title="Accueil V2 desktop" style="width:1440px;height:900px;border:0;background:#0a0e1a;box-shadow:0 20px 60px rgba(0,0,0,.35)"></iframe>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font:500 16px Geist;color:#fff">Mobile · 390 px</div>
      <iframe ref="{{ m }}" src="Accueil V2 - Nuit suisse.dc.html" title="Accueil V2 mobile" style="width:390px;height:844px;border:0;background:#0a0e1a;box-shadow:0 20px 60px rgba(0,0,0,.35)"></iframe>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  d = React.createRef(); m = React.createRef();
  componentDidMount() {
    const fit = (f) => { try { const h = f.contentDocument.documentElement.scrollHeight; if (h > 400) f.style.height = h + 'px'; } catch (e) {} };
    [this.d, this.m].forEach(r => { const f = r.current; if (!f) return; f.addEventListener('load', () => { [600, 1500, 3000].forEach(t => setTimeout(() => fit(f), t)); }); });
  }
  renderVals() { return { d: this.d, m: this.m }; }
}
</script>
</body>
</html>
